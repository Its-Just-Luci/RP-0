CONTRACT_TYPE
{
	name = SSTLargeFirstSupersonic
	group = SSTLarge

	title = Large SST (First Supersonic Flight)

	tag = exclude_Supersonic

	description = <b>Program: X-Plane Research<br>Type: <color=green>Required</color></b><br><br>Design, build, and fly a passenger SST with 3 crew on board, and room for 100, to attain Mach 1 and hold above it for 30 seconds. Vital to the development of new wing shapes and high-speed aerodynamics (the area rule, swept wings, mach tuck, and so on), breaching the sound barrier is a worthy scientific endeavor. Firsts include the U.S. Bell X-1 (1947), the Soviet Lavochkin La-176 (1948), and the British de Havilland DH.108 (1948).<br><br><b><color=green>Note: Astronauts must be trained before launch. There are two types of training, Proficiency Training and Mission Training. Astronauts need Proficiency Training for each crewed part on the vehicle they launch on and for each part that they will enter during their mission. Proficiency Training has to be done only ONCE and lasts FOREVER. Next is Mission Training for the part you intend to launch them in. Mission training must be performed before EVERY flight and will EXPIRE on use or if it goes unused too long. To begin training your astronauts, go to Training tab in the RP-1 window, accessible via the RP-1 icon in the toolbar.</color></b>
	genericDescription = Design, build, and fly a crewed jet aircraft to maintain a specific speed in level flight, then return home safely.

	synopsis = Fly a crewed jet aircraft to maintain @VesselGroup/HoldSituation/minSpeed m/s in level flight and hold, then return safely.

	completedMessage = Congratulations on a successful flight!

	sortKey = 602

	deadline = 0
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 9
	maxSimultaneous = 1

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 25
	failureReputation = 0

	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SSTLarge
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		minCount = 1
		contractType = FIXME
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = FIXME
		invertRequirement = true
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Maintain between @HoldSituation/minSpeed m/s and @HoldSituation/maxSpeed m/s in level flight with a piloted supersonic transport.
		define = supersonicCraft
		dissassociateVesselsOnContractCompletion = true
		resetChildrenWhenVesselDestroyed = true

		PARAMETER
		{
			name = BuiltAtSPH
			type = VesselBuiltAt
			builtAt = SPH
		}

		PARAMETER
		{
			name = Has Crew
			type = HasCrew
			minCrew = 3	// two pilots and a test engineer
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		
		PARAMETER
		{
			name = PassengerCapacity
			type = HasCrewCapacity
			minCapacity = 100 // Concorde is treated as a minimum viable option for this program
			title = Have space for at least 100 passengers on board
			hideChildren = true
		}

		PARAMETER
		{
			name = NoRocket
			type = PartValidation
			title = Vessel is a jet (no rocket engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
		}

		PARAMETER
		{
			name = BreakSoundBarrier
			type = ReachMach
			mach = 1
			title = Fly faster than Mach 1
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = HorizontalLanding
		type = HorizontalLanding
		descentAngle = 3 // Standard for an SST. Tough, but doable.
		hideChildren = true
		completeInSequence = true
	}
	PARAMETER
	{
		name = ReturnHome
		type = RP1ReturnHome
		title = Return home safely
		hideChildren = true
		completeInSequence = true
	}

	PARAMETER
	{
		name = LandOnRunwayOptVG
		type = VesselParameterGroup
		title = OPTIONAL: Land on the runway with a descent angle lower than 3 degrees
		rewardReputation = Round(@/rewardReputation * 0.3 + 0.4999, 1)
		optional = true
		vessel = supersonicCraft
		hideChildren = true

		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 3
			hideChildren = true
			completeInSequence = true
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
	}
}
