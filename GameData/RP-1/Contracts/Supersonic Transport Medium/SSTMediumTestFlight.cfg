CONTRACT_TYPE
{
	name = SSTMediumTestFlight
	group = SSTMedium

	title = Medium SST (Full Scale Test Flight)

	tag = exclude_Supersonic

	description = <b>Program: Medium Supersonic Transport<br>Type: <color=green>Required</color></b><br><br>Design, build, and fly a crewed jet aircraft to maintain @VesselGroup/HoldSituation/minSpeed m/s in level flight, then return home safely. Optionally, landing back at the runway will award extra reputation. If playing from the Cape, the Space Shuttle runway provided by the RSS-CanaveralHD mod is also a valid landing target.<br><br><color=white><b>After this contract has been completed, the 'X-Planes (Supersonic) Optional' contracts will become available.</b></color><br><br><b><color=green>Note: Astronauts must be trained before launch. There are two types of training, Proficiency Training and Mission Training. Astronauts need Proficiency Training for each crewed part on the vehicle they launch on and for each part that they will enter during their mission. Proficiency Training has to be done only ONCE and lasts FOREVER. Next is Mission Training for the part you intend to launch them in. Mission training must be performed before EVERY flight and will EXPIRE on use or if it goes unused too long. To begin training your astronauts, go to Training tab in the RP-1 window, accessible via the RP-1 icon in the toolbar.</color></b>
	genericDescription = Design, build, and fly a crewed jet aircraft to maintain a specific speed in level flight, then return home safely.

	synopsis = Fly a crewed jet aircraft to maintain @VesselGroup/HoldSituation/minSpeed m/s in level flight and hold, then return safely.

	completedMessage = Congratulations on a successful flight!

	sortKey = 602

	deadline = 0
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 1
	maxExpiry = 1

	targetBody = HomeWorld()

	maxCompletions = 1
	maxSimultaneous = 1

	// ************ REWARDS ************
	prestige = Significant
	advanceFunds = 0
	rewardScience = 0
	rewardFunds = 0
	failureFunds = 0
	rewardReputation = 25
	failureReputation = 0

	// ************* REQUIREMENTS ****************

	REQUIREMENT
	{
		name = ProgramActive
		type = ProgramActive
		program = SSTMedium
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		minCount = 1
		contractType = FIXME
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = FIXME
		invertRequirement = true
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Maintain between @HoldSituation/minSpeed m/s and @HoldSituation/maxSpeed m/s in level flight with a piloted supersonic transport.
		define = supersonicCraft
		dissassociateVesselsOnContractCompletion = true
		resetChildrenWhenVesselDestroyed = true

		PARAMETER
		{
			name = BuiltAtSPH
			type = VesselBuiltAt
			builtAt = SPH
		}

		PARAMETER
		{
			name = Has Crew
			type = HasCrew
			minCrew = 3	// two pilots and a test engineer
			crewOnly = true
			title = Have at least 3 crewmembers on board
			hideChildren = true
		}
		
		PARAMETER
		{
			name = PassengerCapacity
			type = HasCrewCapacity
			minCapacity = 50 // 50 passengers is the smallest I've seen SSTs be proposed for, outside of bussiness jets.
			title = Have space for at least 50 passengers on board
			hideChildren = true
		}

		PARAMETER
		{
			name = NoRocket
			type = PartValidation
			title = Vessel is a jet (no rocket engines allowed)
			hideChildren = true
			NONE
			{
				partModule = ModuleEnginesRF
				partModule = ModuleEnginesAJEPropeller
			}
		}

		PARAMETER
		{
			name = HoldSituation
			type = ReachState
			minSpeed = 625	//Mach 2 was the minimum targeted speed during the early attempts at SST's so it seems a good minimum for viable early SSTs
			maxSpeed = 780	//Mach 2.5
			minRateOfClimb = -50
			maxRateOfClimb = 50
			situation = FLYING
			title = Hold between @minSpeed m/s to @maxSpeed m/s in level flight.
			disableOnStateChange = true
			targetBody = @/targetBody
		}
		PARAMETER
		{
			name = SustainedCruise
			type = SustainedCruise
			requiredRange = 3000000	// 3000km, while pitiful, is what the Sud Super Caravelle was targeting.
			minSpeed = 625
			maxSpeed = 780
			minVerticalSpeed = -50
			maxVerticalSpeed = 50
			targetBody = @/targetBody
			disableOnStateChange = false // toggle state so the Duration sibling resets when cruise breaks
		}

		PARAMETER
		{
			name = Hold
			type = Duration
			duration = 15m
			preWaitText = Reach cruise conditions
			waitingText = Maintaining cruise
			completionText = Sustained cruise achieved
		}
	}

	PARAMETER
	{
		name = HorizontalLanding
		type = HorizontalLanding
		descentAngle = 3 // Standard for an SST. Tough, but doable.
		hideChildren = true
		completeInSequence = true
	}
	PARAMETER
	{
		name = ReturnHome
		type = RP1ReturnHome
		title = Return home safely
		hideChildren = true
		completeInSequence = true
	}

	PARAMETER
	{
		name = LandOnRunwayOptVG
		type = VesselParameterGroup
		title = OPTIONAL: Land on the runway with a descent angle lower than 3 degrees
		rewardReputation = Round(@/rewardReputation * 0.3 + 0.4999, 1)
		optional = true
		vessel = supersonicCraft
		hideChildren = true

		PARAMETER
		{
			name = HorizontalLanding
			type = HorizontalLanding
			descentAngle = 3
			hideChildren = true
			completeInSequence = true
		}

		PARAMETER
		{
			name = ReturnHome
			type = RP1ReturnHome
			landAtFacility = Runway
			maxSpeed = 5
			hideChildren = true
			completeInSequence = true
		}
	}
}
