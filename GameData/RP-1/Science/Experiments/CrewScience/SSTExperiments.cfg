@PART[SXTEntenteCordiale]:BEFORE[RP-0-Kerbalism]
{
	%capsuleTier = SSTCockpit
}

// ============================================================================
// Supersonic low 1		-		Sonic Boom Ground Testing
// ============================================================================
EXPERIMENT_DEFINITION
{
	id = RP0SST1
	title = Sonic Boom Testing
	baseValue = 30
	scienceCap = 30
	dataScale = 0.02
	situationMask = 4
	biomeMask = 0
	description = 
	mass = 0.004
	cost = 0
	tags = SSTCockpit
	minCrew = 3
	celestialBodies = Earth
	RESULTS
	{
		default = 
	}
	KERBALISM_EXPERIMENT
	{
		// sample mass in tons. if undefined or 0, the experiment produce a file
		SampleMass = 0.002
		// Body restrictions, multiple lines allowed (just don't use conflicting combinations).
		BodyAllowed = HomeBody
		IncludeExperiment = 
	}
}

@PART[*]:HAS[#capsuleTier[SSTCockpit]]:FOR[RP-0-Kerbalism]
{
	MODULE
	{
		name = Experiment
		experiment_id = RP0SST1

		ec_rate = 0
		%sample_amount = 0.334
		data_rate = 0.02
		@data_rate /= 1600 //30 minutes
		requires = CrewMin:3,SurfaceSpeedMin:530,SurfaceSpeedMax:780,AltitudeMin:10000
		resources = 
		crew_operate = CrewOnly
		hide_when_unavailable = True
	}
}

